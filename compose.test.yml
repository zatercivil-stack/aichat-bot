name: aichat-bot-tests

services:
  test:
    build:
      context: .
      target: test
    environment:
      ENV: test
      BOT_TOKEN: "1234567890:AAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      BOT_USERNAME: test_bot
      ADMIN_IDS: "1"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: aichat_bot_test
      POSTGRES_USER: aichat_test
      POSTGRES_PASSWORD: test_only_password
      REDIS_URL: redis://redis:6379/15
      OPENROUTER_API_KEY: test-not-a-real-key
      ADMIN_TOKEN: test_admin_token_1234567890abcdef
      ADMIN_SECRET_KEY: test_admin_secret_1234567890abcdef
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && pytest"]
    # No production volumes, env_file or published ports.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aichat_bot_test
      POSTGRES_USER: aichat_test
      POSTGRES_PASSWORD: test_only_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aichat_test -d aichat_bot_test"]
      interval: 2s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
