name: Secret scan
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all reachable history with Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scanner_dir="$(mktemp -d)"
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern 'gitleaks_8.30.1_linux_x64.tar.gz' \
            --pattern 'gitleaks_8.30.1_checksums.txt' --dir "$scanner_dir"
          cd "$scanner_dir"
          sha256sum --ignore-missing --check gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          "$scanner_dir/gitleaks" git "$GITHUB_WORKSPACE" --redact --log-opts=--all
