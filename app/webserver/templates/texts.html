{% extends "base.html" %}

{% block content %}
<form method="post" action="/admin/texts">
  <div class="row row-cards">
    {% for key, label, description, default_value in text_rows %}
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">{{ label }}</h3>
          <div class="card-actions text-muted small"><code>{{ key }}</code></div>
        </div>
        <div class="card-body">
          <p class="text-muted small">{{ description }}</p>
          <textarea name="{{ key }}" class="form-control" rows="14" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem">{{ config.get(key, default_value) }}</textarea>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>

  <div class="row mt-3">
    <div class="col-12">
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="ti ti-device-floppy me-1"></i>Сохранить тексты</button>
        <a href="/admin/" class="btn btn-outline-secondary">Отмена</a>
      </div>
      <small class="text-muted d-block mt-2">⚠ Поддерживается HTML: &lt;b&gt;, &lt;i&gt;, &lt;code&gt;, &lt;a href="..."&gt;.<br>
      Изменения применяются сразу для новых запросов.</small>
    </div>
  </div>
</form>
{% endblock %}
