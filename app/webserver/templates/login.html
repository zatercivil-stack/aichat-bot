<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вход — Нейра Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤖%3C/text%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" rel="stylesheet">
<style>
body{background:radial-gradient(ellipse at top,#1a1d33 0%,#0f1226 60%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#dde2f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.login-card{width:380px;background:#1a1d33;border:1px solid #262a44;border-radius:1rem;padding:2.25rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.6);position:relative;overflow:hidden}
.login-card::before{content:"";position:absolute;top:-2px;left:0;right:0;height:3px;background:linear-gradient(90deg,#6366f1,#a855f7,#ec4899)}
.brand-icon{font-size:3rem;margin-bottom:.5rem}
.brand-text{background:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:700;font-size:1.5rem;letter-spacing:-.02em}
.form-control{background:#0f1226;border-color:#262a44;color:#dde2f4;padding:.65rem .85rem;border-radius:.5rem}
.form-control:focus{background:#0f1226;border-color:#6366f1;box-shadow:0 0 0 .2rem rgba(99,102,241,.2);color:#fff}
.form-label{color:#a0a8c0;font-size:.8rem;font-weight:500;margin-bottom:.4rem}
.btn-grad{background:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);border:0;color:#fff;font-weight:600;padding:.65rem;border-radius:.5rem;width:100%;transition:filter .15s}
.btn-grad:hover{filter:brightness(1.15);color:#fff}
.alert{border-radius:.5rem;border:0;background:rgba(239,68,68,.1);color:#fca5a5;padding:.6rem .9rem;font-size:.85rem;margin-bottom:1rem}
</style>
</head>
<body>
<div class="login-card">
  <div class="text-center mb-4">
    <div class="brand-icon">🤖</div>
    <div class="brand-text">Нейра Admin</div>
    <div class="text-muted mt-1" style="font-size:.85rem">AI-ассистент в Telegram</div>
  </div>
  {% if error %}<div class="alert"><i class="ti ti-alert-circle me-1"></i>{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login">
    <div class="mb-3">
      <label class="form-label">Admin Token</label>
      <input type="password" name="token" class="form-control" autofocus required placeholder="••••••••••••">
    </div>
    <button type="submit" class="btn-grad">
      <i class="ti ti-login me-1"></i> Войти
    </button>
  </form>
</div>
</body>
</html>
